action.control_receive: "\u041f\u0440\u0438\u0451\u043c \u0441 \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435\u043c \u043a\u043b\u0430\u0432\u0438\u0430\u0442\u0443\u0440\u043e\u0439"
control.armed: "\u041a\u043b\u0430\u0432\u0438\u0430\u0442\u0443\u0440\u0430 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u0430 — Escape: \u043e\u0442\u043a\u043b\u044e\u0447\u0438\u0442\u044c. \u041d\u0435 \u043c\u0435\u043d\u044f\u0439\u0442\u0435 \u0444\u043e\u043a\u0443\u0441 \u043e\u043a\u043d\u0430."
control.confirm: "\u0420\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044c \u043a\u043b\u0430\u0432\u0438\u0448\u0438? \u041f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u0441\u044c \u043d\u0430 \u0432\u044b\u0431\u0440\u0430\u043d\u043d\u043e\u0435 \u043e\u043a\u043d\u043e \u0432\u0440\u0443\u0447\u043d\u0443\u044e \u0437\u0430 3 \u0441\u0435\u043a\u0443\u043d\u0434\u044b. RasterDock \u043d\u0435 \u0430\u043a\u0442\u0438\u0432\u0438\u0440\u0443\u0435\u0442 \u043e\u043a\u043d\u043e. \u041f\u043e\u0442\u0435\u0440\u044f \u0444\u043e\u043a\u0443\u0441\u0430 \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435."
control.switch_target: "Переключитесь на выбранное окно в течение 3 секунд. Автоматического вывода окна вперёд нет."
control.complete: "Управляемая передача завершена: все файлы проверены и опубликованы. Отправка клавиш остановлена."
control.quarantine: "\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043e. \u041f\u043e\u0437\u0434\u043d\u0438\u0435 \u043a\u043b\u0430\u0432\u0438\u0448\u0438 \u043e\u0442\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u044e\u0442\u0441\u044f. \u041e\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435 \u0443\u0434\u0430\u043b\u0451\u043d\u043d\u044b\u0439 \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u043b\u0435\u0440, \u0437\u0430\u0442\u0435\u043c \u0449\u0451\u043b\u043a\u043d\u0438\u0442\u0435 \u0437\u0434\u0435\u0441\u044c, \u0447\u0442\u043e\u0431\u044b \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u043e\u043a\u043d\u043e. \u0414\u043b\u044f \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0433\u043e \u0437\u0430\u043f\u0443\u0441\u043a\u0430 \u043e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 RasterDock \u0441\u043d\u043e\u0432\u0430. \u042d\u0442\u043e \u043d\u0435 \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u0443\u0434\u0430\u043b\u0451\u043d\u043d\u044b\u0439 \u0432\u0432\u043e\u0434 \u0430\u0442\u043e\u043c\u0430\u0440\u043d\u043e."
control.instructions: "Управляемый просмотрщик удерживает страницу до клавиатурной команды. Оставляйте его в фокусе; Escape снимает управление. После этого текущий защитный экран требует закрыть и заново открыть окно."
