profile.fit: "\u041d\u0443\u0436\u043d\u043e {{.width}} × {{.height}}; \u0434\u043e\u0441\u0442\u0443\u043f\u043d\u043e {{.availableWidth}} × {{.availableHeight}}. \u0423\u0432\u0435\u043b\u0438\u0447\u044c\u0442\u0435 \u043e\u043a\u043d\u043e \u0438\u043b\u0438 \u0443\u043c\u0435\u043d\u044c\u0448\u0438\u0442\u0435 \u043c\u043e\u0434\u0443\u043b\u044c/\u0441\u0435\u0442\u043a\u0443, \u0437\u0430\u0442\u0435\u043c \u0432\u043e\u0437\u043e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u043f\u043e\u043a\u0430\u0437."
