name: Windows storage API diagnostic (not durability acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: .go-version
      - name: Test diagnostic helpers
        run: go test -count=1 ./scripts/windows-durability-probe
      - name: Build diagnostic (no elevated execution)
        run: go build -o "$env:RUNNER_TEMP\windows-durability-probe.exe" ./scripts/windows-durability-probe
      - name: Observe APIs under temporary standard local account
        run: ./scripts/windows-durability-probe/run-standard-user.ps1 -ProbePath "$env:RUNNER_TEMP\windows-durability-probe.exe" -ArtifactDirectory "$env:GITHUB_WORKSPACE\windows-durability-observations"
      - name: Retain observations and bootstrap errors even on failure
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-storage-api-observations
          path: windows-durability-observations/
          if-no-files-found: warn
          retention-days: 14
